# O sistema inteiro numa maquina limpa (docs/adr/0014):
#
#   cp .env.exemplo .env      # e edite os dois valores
#   docker compose up -d
#   curl localhost:8080/api/v1/moedas
#
# As variaveis ${...} vem do arquivo .env deste diretorio, que o compose le
# sozinho e que o .gitignore barra do repositorio.

services:

  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cripto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      # Dados sobrevivem a `docker compose down`; somem com `down -v`.
      - dados-banco:/var/lib/postgresql/data
      # Rodam UMA vez, na primeira subida com o volume vazio, em ordem de nome.
      # 10: o espelho do schema do pipeline (docs/adr/0010) - tabela, indice e
      #     a view que a API le. E o mesmo arquivo que o teste usa.
      # 20: dados reais exportados do banco do autor, para a API nao nascer vazia.
      - ./src/test/resources/schema-pipeline.sql:/docker-entrypoint-initdb.d/10-schema-pipeline.sql:ro
      - ./docker/dados-exemplo.sql:/docker-entrypoint-initdb.d/20-dados-exemplo.sql:ro
    ports:
      # 5433, nao 5432: a maquina do autor ja tem um PostgreSQL na 5432.
      # Preso a 127.0.0.1 - so a propria maquina enxerga.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cripto"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    # Com image E build: usa a imagem publicada se existir localmente;
    # senao constroi do Dockerfile. `docker compose build` forca a construcao.
    image: ghcr.io/wilsongorosthides/cripto-api:latest
    build: .
    depends_on:
      banco:
        condition: service_healthy
    environment:
      # Relaxed binding: SPRING_DATASOURCE_URL vira spring.datasource.url.
      # "banco" e o nome do servico acima - o DNS interno do compose resolve.
      SPRING_DATASOURCE_URL: jdbc:postgresql://banco:5432/cripto
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CRIPTO_JWT_SEGREDO: ${CRIPTO_JWT_SEGREDO:?defina CRIPTO_JWT_SEGREDO no .env (minimo 32 bytes)}
    ports:
      - "8080:8080"
    healthcheck:
      # readiness, nao liveness: "pronto" inclui a conexao com o banco.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

volumes:
  dados-banco:
