# Configuracao valida SOMENTE em teste. Este arquivo SUBSTITUI o
# src/main/resources/application.properties inteiro quando os testes rodam.
#
# Nao ha datasource aqui de proposito: url, usuario e senha vem do container,
# injetados pelo @ServiceConnection de ContainerDeTeste.

spring.application.name=cripto-api-teste

# Mitigacao 1 do ADR 0010: o Hibernate compara as entidades com o schema do
# container ao subir e FALHA se divergirem. E o que impede o espelho de sair
# de sincronia com as classes Java sem ninguem notar.
spring.jpa.hibernate.ddl-auto=validate

# Mesma situacao do banco real: o container ja tem precos_cripto (espelho do
# ADR 0010) quando o Flyway chega. Sem estas duas linhas o teste falharia
# igual a producao - e e bom que falhe igual. Ver docs/adr/0011, regra 3.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100
