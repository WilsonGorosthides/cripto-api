spring.application.name=cripto-api

# Conexao com o banco que o pipeline Python alimenta.
# A SENHA NAO FICA AQUI: este arquivo e versionado. Ela vem da variavel de
# ambiente SPRING_DATASOURCE_PASSWORD, que o Spring mapeia sozinho para a
# propriedade spring.datasource.password.
spring.datasource.url=jdbc:postgresql://localhost:5432/cripto
spring.datasource.username=postgres

# O schema de precos_cripto pertence ao pipeline Python.
# 'none' proibe o Hibernate de criar, alterar ou apagar qualquer tabela.
spring.jpa.hibernate.ddl-auto=none

# Flyway cria SOMENTE as tabelas da API (docs/adr/0011). O banco ja tem
# precos_cripto quando o Flyway chega, e um schema nao vazio sem historico
# e recusado por padrao - dai o baseline-on-migrate. O baseline-version=0
# e obrigatorio junto: sem ele o Flyway marca o banco como "ja na versao 1"
# e a V1 nunca roda.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Fecha a sessao do JPA ao sair do Service, e nao ao fim da resposta HTTP.
# Sem isso, uma consulta preguicosa dispara no meio da serializacao do JSON,
# longe do lugar onde o erro faria sentido.
spring.jpa.open-in-view=false

# Teto de itens por pagina. Sem isto, ?size=1000000 traria a serie inteira e
# anularia o proposito da paginacao - o cliente decidiria sozinho quanta
# memoria o servidor gasta numa requisicao.
spring.data.web.pageable.max-page-size=100

# JWT (docs/adr/0012). O SEGREDO NAO FICA AQUI: vem da variavel de ambiente
# CRIPTO_JWT_SEGREDO (minimo 32 bytes), mapeada para cripto.jwt.segredo.
# Sem ela a aplicacao recusa subir - melhor do que subir assinando com nada.
# Validade curta e sem renovacao: token vazado vale ate expirar, e so.
cripto.jwt.validade=PT1H

# Job de alertas (docs/adr/0013): compara os alertas ativos com a ultima
# coleta a cada intervalo. Precisa ser MENOR que o intervalo do pipeline
# (1h); se fosse maior, uma coleta poderia passar sem ser avaliada.
cripto.alertas.intervalo=PT5M
